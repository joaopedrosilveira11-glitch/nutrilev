<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nutrilev para alunos, coaches e academias." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://*.supabase.co; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" />
    <title>Nutrilev | Plataforma</title>
    <script src="theme.js"></script>
    <link rel="icon" type="image/png" href="assets/logo-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="platform.css?v=76" />
    <link rel="stylesheet" href="platform-density.css?v=4" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lib/config.js"></script>
    <script src="utils/index.js"></script>
    <script src="utils/html.js"></script>
    <script src="components/index.js"></script>
    <script src="components/ui.js"></script>
    <script src="services/index.js"></script>
    <script src="services/supabase.js"></script>
    <script src="services/platform-data.js?v=8"></script>
    <script src="mobile/index.js"></script>
    <script src="auth/roles.js"></script>
    <script src="hooks/session.js"></script>
    <script src="types/domain.js"></script>
    <script src="layouts/platform-shell.js"></script>
    <script src="pages/routes.js"></script>
    <script src="dashboard/index.js"></script>
    <script src="student/index.js"></script>
    <script src="coach/module.js"></script>
    <script src="admin/module.js"></script>
    <script src="features/dashboard/index.js"></script>
    <script src="features/coach/index.js"></script>
    <script src="features/admin/index.js"></script>
    <script src="features/student/index.js"></script>
  </head>
  <body>
    <div class="platform-shell">
      <aside class="sidebar" id="sidebar">
        <a class="platform-brand" href="landing.html"><img src="assets/logo-icon.png" alt="" /><span>Nutrilev<small>plataforma</small></span></a>
        <div class="role-picker">
          <span class="eyebrow">VISÃO ATUAL</span>
          <select id="roleSelect" aria-label="Selecionar perfil">
            <option value="student">Aluno</option>
            <option value="coach">Coach / Personal</option>
            <option value="admin">Administração</option>
          </select>
        </div>
        <nav class="main-nav" id="mainNav" aria-label="Navegação da plataforma"></nav>
        <div class="sidebar-bottom"><a href="landing.html">← Voltar para o site</a><button id="logoutButton" type="button">Sair da conta</button></div>
      </aside>

      <main class="platform-main">
        <header class="platform-topbar">
          <button class="menu-button" id="menuButton" type="button" aria-label="Abrir menu"></button>
          <a class="mobile-topbar-brand" href="landing.html" aria-label="Nutrilev início"><img src="assets/logo-icon.png" alt="Nutrilev" /></a>
          <div><span class="eyebrow" id="pageEyebrow">VISÃO GERAL</span><h1 id="pageTitle">Seu dia mais leve</h1></div>
          <div class="topbar-actions"><button class="theme-toggle" type="button" data-theme-toggle aria-label="Usar modo escuro" title="Usar modo escuro" aria-pressed="false"><span aria-hidden="true" data-theme-icon>☾</span><span data-theme-label>Modo escuro</span></button><button class="icon-button" type="button" aria-label="Notificações"><i></i></button><div class="user-chip"><span id="userInitial">A</span><div><strong id="userName">Aluno</strong><small id="userRole">Aluno</small></div></div></div>
        </header>
        <div class="demo-banner" id="demoBanner" hidden></div>
        <section class="dashboard" id="dashboard" aria-live="polite" aria-busy="true">
          <div class="dashboard-grid loading-state" aria-label="Carregando painel">
            <article class="card skeleton-card skeleton-hero"><span></span><span></span><span></span></article>
            <article class="card skeleton-card skeleton-metric"><span></span><span></span><span></span></article>
            <article class="card skeleton-card skeleton-section"><span></span><span></span><span></span><span></span></article>
            <article class="card skeleton-card skeleton-section"><span></span><span></span><span></span></article>
          </div>
        </section>
      </main>
    </div>

    <div class="auth-overlay" id="authOverlay" hidden>
      <div class="auth-card">
        <button class="theme-toggle login-theme-toggle" type="button" data-theme-toggle aria-label="Usar modo escuro" title="Usar modo escuro" aria-pressed="false"><span aria-hidden="true" data-theme-icon>☾</span><span data-theme-label>Modo escuro</span></button>
        <button class="close-auth" id="closeAuth" type="button" aria-label="Fechar">×</button>
        <img src="assets/logo-icon.png" alt="" /><span class="eyebrow accent">ACESSO NUTRILEV</span>
        <h2>Entre na sua plataforma.</h2><p>Use o mesmo e-mail da sua conta Nutrilev.</p>
        <form id="loginForm"><label>E-mail<input name="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com" /></label><label>Senha<input name="password" type="password" autocomplete="current-password" required placeholder="Sua senha" /></label><p class="form-message" id="authMessage" hidden></p><button class="primary-button" type="submit">Entrar <span>→</span></button></form>
        <a href="landing.html">Ainda não tenho uma conta</a>
      </div>
    </div>
    <script src="platform.js?v=77"></script>
  </body>
</html>
